[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs", "setuptools-scm>=9"]
build-backend = "hatchling.build"

[project]
name = "zarr-storage"
dynamic = ["version"]
description = "A Zarr-agnostic key-value storage layer for Zarr implementations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Davis Bennett", email = "davis.v.bennett@gmail.com" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["zarr", "storage", "key-value"]
dependencies = [
    # `typing_extensions.Buffer`, the buffer-protocol type, before Python 3.12's
    # `collections.abc.Buffer`.
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
# `zarr_storage.backends.ObjectStoreBackend`.
obstore = ["obstore>=0.12"]
# The `zarr_storage.testing` conformance suite.
testing = ["pytest>=8", "hypothesis>=6.85"]

[project.urls]
Homepage = "https://github.com/zarr-developers/zarr-python"
Source = "https://github.com/zarr-developers/zarr-python/tree/main/packages/zarr-storage"
Issues = "https://github.com/zarr-developers/zarr-python/issues"
Changelog = "https://github.com/zarr-developers/zarr-python/blob/main/packages/zarr-storage/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8",
    "hypothesis>=6.85",
    "obstore>=0.12",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^zarr_storage-v(?P<version>.+)$'
raw-options = { root = "../..", scm = { git = { describe_command = "git describe --dirty --tags --long --match zarr_storage-v*" } }, local_scheme = "no-local-version", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_storage"]

# An allowlist, so nothing that merely happens to sit in the package directory
# can ride along in a release.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/justfile",
    "/CHANGELOG.md",
]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py311"

[tool.ruff.lint]
# Use `object` for "any value"; a genuinely dynamic annotation needs a noqa
# saying why.
extend-select = ["ANN401"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
xfail_strict = true
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.numpydoc_validation]
checks = [
    "GL10",
    "SS04",
    "PR02",
    "PR03",
    "PR05",
    "PR06",
]

# Pyright is the only checker that runs on this package.
[tool.pyright]
include = ["src", "tests"]
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"
extraPaths = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingTypeArgument = false
reportPrivateUsage = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnusedFunction = false

[tool.towncrier]
directory = "changes"
filename = "CHANGELOG.md"
package = "zarr_storage"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/zarr-developers/zarr-python/pull/{issue})"
start_string = "<!-- towncrier release notes start -->\n"
template = "towncrier-template.md"

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true
