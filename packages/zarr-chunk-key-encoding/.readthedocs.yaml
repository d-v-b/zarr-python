# Read the Docs configuration for the zarr-chunk-key-encoding docs site,
# separate from the zarr-python site configured by the repo-root
# .readthedocs.yaml. The RTD project for zarr-chunk-key-encoding must set its
# configuration-file path to packages/zarr-chunk-key-encoding/.readthedocs.yaml.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # Cancel pull request builds that do not touch this package. Exit code
      # 183 cancels the build and reports success to the Git provider. Scoped
      # to PR builds ("external" versions) because origin/main is only a
      # meaningful diff base there.
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- packages/zarr-chunk-key-encoding;
        then
          exit 183;
        fi
    install:
      - pip install --upgrade pip
      - pip install ./packages/zarr-chunk-key-encoding --group packages/zarr-chunk-key-encoding/pyproject.toml:docs
    build:
      html:
        - mkdocs build --strict -f packages/zarr-chunk-key-encoding/mkdocs.yml --site-dir $READTHEDOCS_OUTPUT/html

mkdocs:
  configuration: packages/zarr-chunk-key-encoding/mkdocs.yml
