name: zarr-chunk-key-encoding

# Job steps delegate to packages/zarr-chunk-key-encoding/justfile, the single
# source of truth for this package's verbs; CI owns only the python matrix and
# caching. Keeping the commands in one place is what makes `just check`
# locally mean the same thing as a green run here.

on:
  push:
    branches: [main]
    paths:
      - 'packages/zarr-chunk-key-encoding/**'
      - '.github/workflows/zarr-chunk-key-encoding.yml'
      # The parity suite compares against zarr's own chunk key encodings, and
      # the package builds on the zarr-metadata types, so changes to either can
      # break this suite.
      - 'packages/zarr-metadata/**'
      - 'src/zarr/**'
  pull_request:
    paths:
      - 'packages/zarr-chunk-key-encoding/**'
      - '.github/workflows/zarr-chunk-key-encoding.yml'
      # The parity suite compares against zarr's own chunk key encodings, and
      # the package builds on the zarr-metadata types, so changes to either can
      # break this suite.
      - 'packages/zarr-metadata/**'
      - 'src/zarr/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest py=${{ matrix.python-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-chunk-key-encoding
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync test dependency group
        run: uv sync --group test --python ${{ matrix.python-version }}
      - name: Run pytest
        run: just test

  parity:
    name: pytest parity (with zarr)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-chunk-key-encoding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # `just test` skips tests/test_zarr_parity.py when zarr is absent, which
      # is right for the package-isolated matrix above but would let the parity
      # suite silently never run anywhere. This recipe layers the repo-root
      # environment in so the byte-for-byte comparison against
      # zarr.core.chunk_key_encodings actually executes, and
      # ZARR_PARITY_REQUIRED turns a missing zarr into a hard failure rather
      # than a green run that quietly tested nothing.
      - name: Run parity suite against repo-root zarr
        env:
          ZARR_PARITY_REQUIRED: '1'
        run: just test-parity

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-chunk-key-encoding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Run ruff
        run: just lint

  pyright:
    name: pyright
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-chunk-key-encoding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Run pyright
        # The pyright version and interpreter pins live in the justfile.
        run: just typecheck

  docs:
    name: docs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/zarr-chunk-key-encoding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Build docs
        run: just docs-check

  zarr-chunk-key-encoding-complete:
    name: zarr-chunk-key-encoding complete
    needs: [test, parity, ruff, pyright, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check failure
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo Success!
