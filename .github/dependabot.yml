---
version: 2
updates:
  # Updates for main
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # Keep the pinned dev tooling in pyproject.toml's [dependency-groups] and the
  # uv.lock current. Without this the exact pins (e.g. pytest) would never be
  # bumped automatically and would silently rot.
  #
  # `allow: dependency-type: direct` restricts updates to dependencies declared
  # in pyproject.toml. Transitive deps in uv.lock are then only updated as a
  # side effect of a direct bump, never via a standalone PR.
  - package-ecosystem: "uv"
    directory: "/"
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # Exclude these runtime/integration dependencies as version-update targets.
    # In particular, a botocore update can conflict with s3fs/aiobotocore caps.
    # This does not freeze versions changed indirectly by other updates or
    # guarantee that every grouped dependency resolution succeeds. Optional,
    # minimum-dependency, and upstream test environments cover different
    # dependency selections within their own constraints.
    ignore:
      - dependency-name: "botocore"
      - dependency-name: "s3fs"
      - dependency-name: "fsspec"
      - dependency-name: "obstore"
      - dependency-name: "numcodecs"
      - dependency-name: "universal-pathlib"
    cooldown:
      default-days: 7
