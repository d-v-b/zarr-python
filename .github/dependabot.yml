---
version: 2
updates:
  # Updates for main
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  # Keep the pinned dev tooling in pyproject.toml's [dependency-groups] and the
  # uv.lock current. Without this the exact pins (e.g. pytest) would never be
  # bumped automatically and would silently rot.
  #
  # `allow: dependency-type: direct` restricts updates to dependencies declared
  # in pyproject.toml. Transitive deps in uv.lock are then only updated as a
  # side effect of a direct bump, never via a standalone PR.
  - package-ecosystem: "uv"
    directory: "/"
    allow:
      - dependency-type: "direct"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    # pyproject.toml deliberately leaves the runtime/integration deps floating
    # (fsspec, obstore, s3fs, botocore, numcodecs, universal-pathlib): the
    # `optional` test matrix exercises their latest releases, and their floor
    # and bleeding edge are covered by the min_deps and upstream hatch envs.
    # Dependabot must not try to pin or bump them: resolving a botocore bump
    # against s3fs/aiobotocore's tight caps is unsatisfiable and fails the
    # whole update job.
    ignore:
      - dependency-name: "botocore"
      - dependency-name: "s3fs"
      - dependency-name: "fsspec"
      - dependency-name: "obstore"
      - dependency-name: "numcodecs"
      - dependency-name: "universal-pathlib"
    cooldown:
      default-days: 7
